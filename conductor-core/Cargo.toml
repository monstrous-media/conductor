[package]
name = "conductor-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Conductor core multi-protocol input mapping engine (UI-independent)"

[lib]
name = "conductor_core"
path = "src/lib.rs"

[dependencies]
# Core engine dependencies
midir.workspace = true
serde.workspace = true
serde_json.workspace = true  # Plugin system
toml.workspace = true
hidapi.workspace = true
gilrs.workspace = true  # Gamepad/HID input
quick-xml.workspace = true
crossbeam-channel.workspace = true
thiserror.workspace = true
idna = "1"  # D17 egress: IDNA/Punycode host normalization for allowlist matching
ipnet = "2"  # ADR-042 Phase A: CIDR parsing/matching for network ACLs
rand.workspace = true
regex.workspace = true  # Security validation
arc-swap = "1"  # Lock-free atomic swap for CompiledRuleSet (ADR-009 Phase 3)
dashmap.workspace = true  # Concurrent sharded state store (ADR-025)
indexmap.workspace = true  # Ordered branch map for PcContextSwitch (ADR-025 Phase 2.D)
dirs.workspace = true  # Path handling
midi-msg.workspace = true  # MIDI message parsing
libloading.workspace = true  # Plugin loading
sha2.workspace = true  # Checksum verification
zeroize = "1"  # ADR-042 Phase B-early: scrub HMAC key material from memory on drop
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }  # ADR-042 Phase B-early: OS keychain for the network-approval HMAC key; features match conductor-gui so the workspace builds unchanged
ed25519-dalek = { workspace = true, optional = true }  # Plugin signing
hex = { workspace = true, optional = true }  # Hex encoding for signatures
chrono = { workspace = true, optional = true }  # Timestamps for signatures
tempfile = { version = "3.27", optional = true }  # Secure atomic CRL writes (ADR-027 D9)
reqwest = { version = "0.13", features = ["json"], optional = true }  # Plugin registry
rosc = { version = "0.11", optional = true }  # OSC message encoding (ADR-009 Gap H)
tokio = { version = "1.50", features = ["fs", "net"], optional = true }  # Async runtime for registry; "net" = D17 egress DNS resolution
anyhow = { version = "1.0", optional = true }  # Error handling for WASM

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# WASM plugin runtime (sandboxed execution)
[dependencies.wasmtime]
workspace = true
optional = true

[dependencies.wasmtime-wasi]
workspace = true
optional = true

# Platform-specific MIDI output (optional)
[target.'cfg(target_os = "macos")'.dependencies]
coremidi = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = { workspace = true, optional = true }

# ADR-042 Phase B-early: hardened keychain file-perms fallback uses
# O_NOFOLLOW/O_EXCL open + fstat(UID/S_ISREG/mode) on Unix.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
conductor-daemon = { version = "0.1.0", path = "../conductor-daemon" }  # For integration tests
proptest.workspace = true
rstest.workspace = true
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3.27"  # For plugin discovery tests

[[bench]]
name = "event_processing"
harness = false

[[bench]]
name = "mapping_engine"
harness = false

[[bench]]
name = "end_to_end"
harness = false

[[bench]]
name = "rule_engine"
harness = false

[[bench]]
name = "control_state_routing"
harness = false

[[bench]]
name = "probe_ingress_overhead"
harness = false

[features]
default = ["virtual-midi"]
test-mocks = []
virtual-midi = ["dep:coremidi", "dep:alsa"]
plugin = []  # Enable plugin support (native .dylib/.so/.dll)
plugin-registry = ["dep:reqwest", "dep:tokio"]  # Enable plugin registry client
plugin-wasm = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:anyhow", "dep:tokio"]  # Enable WASM plugin support
plugin-signing = ["dep:ed25519-dalek", "dep:hex", "dep:chrono", "dep:tempfile"]  # Enable plugin signing/verification
osc = ["dep:rosc"]  # Enable OSC message support (ADR-009 Gap H)

[lints]
workspace = true
