# cargo-deny configuration — starter policy for the public engine workspace.
# Inert until the Cargo workspace lands (Workstream B); tune the license
# allowlist against the regenerated THIRD_PARTY_LICENSES at migration time.

[graph]
all-features = false
# Evaluate the graph per shipped target instead of treating every cfg as
# true: tray-icon is a macOS-only dependency, and without this cargo-deny
# would still walk its Linux-only unmaintained GTK3 subtree straight from
# Cargo.lock.
targets = [
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"
# Unmaintained-crate advisories: flag only DIRECT workspace dependencies.
# Transitively, tray-icon's Linux backend drags in the archived gtk-rs
# GTK3 binding tree (RUSTSEC-2024-041x) and proc-macro-error — not
# fixable from here short of replacing tray-icon (tracked follow-up).
# Vulnerability/unsound advisories remain denied at full graph depth.
unmaintained = "workspace"
# RustSec advisories: deny by default. Add temporary ignores here only with
# a comment linking the tracking issue (pattern carried from private repo).
ignore = []

[licenses]
version = 2
# The workspace is MIT; allow the permissive set common to its dependency
# graph. Anything outside this list fails CI and must be reviewed.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path-only dev-deps (no version) are deliberate: cargo strips them at
# packaging, which is what breaks the core→daemon→core dev-dep cycle on
# first publish. Only wildcard REGISTRY deps remain denied.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git dependencies in the public workspace — the crates.io seam
# (ADR-046 D2) is the rule; add exceptions only with justification.
allow-git = []
