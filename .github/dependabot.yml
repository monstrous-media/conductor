# Dependabot — keeps dependencies and pinned action SHAs current.
#
# Workflows SHA-pin actions by commit; Dependabot tracks the upstream
# branch via the trailing comment and opens a reviewable PR when it moves.
#
# Grouping policy: minor + patch bumps are batched into one PR per
# ecosystem per week to keep review load low. Major bumps stay as
# individual PRs — they need deliberate review.
version: 2
updates:
  # ── GitHub Actions — keeps SHA pins current ──────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── Rust workspace ───────────────────────────────────────────────
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
