# Keep the dependency graph and CI actions patched. Grouped weekly PRs to
# keep the noise manageable; security updates arrive regardless of schedule.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
