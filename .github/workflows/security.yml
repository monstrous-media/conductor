# Security / supply-chain checks (ADR-046 D4).
# GitHub-hosted runners only. No secrets required — gitleaks runs via its
# OSS container (the gitleaks-action needs an org license key; the CLI
# does not, and the public repo carries no secrets by policy).
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — public history starts at the squash commit
      - name: Run gitleaks over tree + history
        run: |
          # Digest-pinned (supply-chain hygiene; Scorecard Pinned-Dependencies).
          # Bump deliberately: docker pull zricethezav/gitleaks:latest && docker inspect --format='{{index .RepoDigests 0}}' zricethezav/gitleaks:latest
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:latest@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --no-banner --redact -v

  license-inventory:
    name: license-inventory (NOTICE/THIRD_PARTY_LICENSES drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch 2026-09
      - name: Install cargo-license (pinned)
        run: cargo install cargo-license --version 0.7.0 --locked
      - name: Regenerate and diff attribution files
        run: |
          ./scripts/gen-third-party-licenses.sh
          git diff --exit-code -- NOTICE THIRD_PARTY_LICENSES.md || {
            echo "::error::NOTICE/THIRD_PARTY_LICENSES.md are stale — run 'just licenses' and commit the result"
            exit 1
          }

  cargo-deny:
    name: cargo-deny (licenses, bans, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skip on scaffold
        id: check
        run: |
          [ -f Cargo.toml ] && echo "has_code=true" >> "$GITHUB_OUTPUT" || echo "has_code=false" >> "$GITHUB_OUTPUT"
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        if: steps.check.outputs.has_code == 'true'
        with:
          command: check licenses bans advisories sources

  cargo-audit:
    name: cargo-audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skip on scaffold
        id: check
        run: |
          [ -f Cargo.lock ] && echo "has_code=true" >> "$GITHUB_OUTPUT" || echo "has_code=false" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch 2026-09
        if: steps.check.outputs.has_code == 'true'
      - name: Install and run cargo-audit
        if: steps.check.outputs.has_code == 'true'
        run: |
          cargo install cargo-audit --locked
          cargo audit
