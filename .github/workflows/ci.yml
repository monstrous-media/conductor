# Public CI — authored for GitHub-hosted runners (ADR-046 D4).
# NEVER add self-hosted runners to this workflow or this repo
# (enforced by tests/ci_runner_policy.rs).
#
# The feature-composition matrix implements ADR-045 D3: every official
# composition of conductor-daemon (mcp / llm-executor / mcp-write) must
# stay green, built package-scoped on both shipped OS families.
#
# All cargo invocations run --locked: CI must build exactly the graph
# that Cargo.lock pins (and that cargo-deny/cargo-audit audited).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - name: License headers
        run: ./scripts/check-spdx.sh

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # alsa/udev: MIDI + gilrs. xdo: enigo keystroke output.
          # (No GTK: the tray stack is a macOS-only target dependency.)
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev pkg-config libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --all-features so core's plugin/plugin-wasm/plugin-signing code is
      # linted too — the compositions matrix below only varies daemon features.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # alsa/udev: MIDI + gilrs. xdo: enigo keystroke output.
          # (No GTK: the tray stack is a macOS-only target dependency.)
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev pkg-config libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Default-features build first (what a plain `cargo build` gives users),
      # then the full-features test suite — core's plugin runtimes and the
      # daemon's write/executor tiers are only compiled with their features on.
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --all-features --locked

  # ADR-045 D3 — official daemon compositions, built PACKAGE-SCOPED
  # (never --workspace: feature unification must not leak paid features
  # into the OSS artifact). Negative artifact assertions live in the
  # release workflow; this matrix keeps every composition compiling on
  # both shipped OS families (Linux-only paths — landlock, nix — are
  # invisible to a macOS-only matrix).
  compositions:
    name: daemon (${{ matrix.composition }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        composition: [minimal, oss-default, studio-bundle, source-build]
        include:
          - composition: minimal
            flags: "--no-default-features"
          - composition: oss-default   # default = mcp (read-only)
            flags: ""
          - composition: studio-bundle # mcp + llm-executor (IPC-only write)
            flags: "--features llm-executor"
          - composition: source-build  # mcp-write — never in official artifacts
            flags: "--features mcp-write"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev pkg-config libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p conductor-daemon ${{ matrix.flags }} --locked
      - run: cargo test  -p conductor-daemon ${{ matrix.flags }} --locked
