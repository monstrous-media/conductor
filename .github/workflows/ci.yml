# Public CI — authored fresh for GitHub-hosted runners (ADR-046 D4).
# NEVER add self-hosted runners to this workflow or this repo.
#
# Scaffold-aware: until the engine code lands (ADR-046 Workstream B), the
# `gate` job detects the absence of Cargo.toml and all Rust jobs skip,
# keeping the workflow green. When code lands, everything activates.
#
# The feature-composition matrix implements ADR-045 D3: all official
# compositions must stay green. It assumes the ADR-045 cargo features
# (mcp / llm-executor / mcp-write) exist on conductor-daemon — that work
# (release-readiness A1) must merge before the migration PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    outputs:
      has_code: ${{ steps.check.outputs.has_code }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f Cargo.toml ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
            echo "Scaffold repo — no Cargo workspace yet; Rust jobs will skip."
          fi

  fmt:
    name: rustfmt
    needs: gate
    if: needs.gate.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: gate
    if: needs.gate.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux build deps (ALSA, udev for gilrs/evdev)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: gate
    if: needs.gate.outputs.has_code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace

  # ADR-045 D3 — official daemon compositions, built PACKAGE-SCOPED
  # (never --workspace: feature unification must not leak paid features
  # into the OSS artifact). Negative artifact assertions live in the
  # release workflow; this matrix keeps every composition compiling.
  compositions:
    name: daemon (${{ matrix.name }})
    needs: gate
    if: needs.gate.outputs.has_code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimal
            flags: "--no-default-features"
          - name: oss-default          # default = mcp (read-only)
            flags: ""
          - name: studio-bundle        # mcp + llm-executor (IPC-only write)
            flags: "--features llm-executor"
          - name: source-build         # mcp-write — never in official artifacts
            flags: "--features mcp-write"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p conductor-daemon ${{ matrix.flags }}
      - run: cargo test  -p conductor-daemon ${{ matrix.flags }}
