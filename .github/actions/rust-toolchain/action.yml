# #2148: install the Rust toolchain PINNED in rust-toolchain.toml, not the
# floating `stable` channel.
#
# dtolnay/rust-toolchain@<stable-sha> defaults its `toolchain` input to
# `stable`, and does NOT read rust-toolchain.toml — so every CI job ran
# `rustup toolchain install stable`, i.e. whatever stable happens to be that
# day. Builds were only saved from floating because rust-toolchain.toml
# (channel = "1.95.0", #1435) overrides the compiler at cargo-invocation time;
# CI still installed a floating toolchain and relied on that override
# implicitly. This composite reads the pinned channel from rust-toolchain.toml
# — the single source of truth — and passes it to dtolnay explicitly, so CI
# installs exactly the pinned version. Bump the toolchain by editing
# rust-toolchain.toml (the Lint job's #1435 guard keeps it an explicit X.Y.Z).
name: Install pinned Rust toolchain
description: >-
  Install the Rust toolchain version pinned in rust-toolchain.toml (single
  source of truth) instead of the floating `stable` channel (#2148).
inputs:
  components:
    description: Comma-separated components to install (e.g. "rustfmt, clippy").
    required: false
    default: ""
  targets:
    description: Comma-separated target triples to install.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Resolve pinned toolchain channel
      id: channel
      shell: bash
      run: |
        set -euo pipefail
        # Reuse the #1435 parse: quote-agnostic RHS, strip inline comment,
        # require an explicit X.Y.Z release.
        line=$(grep -E '^[[:space:]]*channel[[:space:]]*=' rust-toolchain.toml | head -1 || true)
        if [ -z "$line" ]; then
          echo "::error file=rust-toolchain.toml::no [toolchain] channel found (#2148)"
          exit 1
        fi
        rhs=${line#*=}
        rhs=${rhs%%#*}
        rhs=$(printf '%s' "$rhs" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
        channel=$(printf '%s' "$rhs" | sed -E "s/^[\"']//; s/[\"']\$//")
        if ! printf '%s' "$channel" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error file=rust-toolchain.toml::channel '$channel' is not an explicit X.Y.Z release; pin a specific version (#2148)"
          exit 1
        fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
    - name: Install toolchain ${{ steps.channel.outputs.channel }}
      # SHA-pinned dtolnay/rust-toolchain; `toolchain` is forced to the pinned
      # channel above, overriding the action's floating `stable` default.
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned via rust-toolchain.toml
      with:
        toolchain: ${{ steps.channel.outputs.channel }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
