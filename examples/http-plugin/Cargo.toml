[package]
name = "conductor-http-plugin"
version = "1.0.0"
edition = "2021"
authors = ["Conductor Contributors"]
license = "MIT"
description = "Example HTTP request plugin for Conductor"

# This is a standalone plugin, not part of the main workspace
[workspace]

[lib]
name = "conductor_http_plugin"
crate-type = ["cdylib"]

[dependencies]
conductor-core = { path = "../../conductor-core" }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }
