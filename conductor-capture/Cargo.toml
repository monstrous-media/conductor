[package]
name = "conductor-capture"
version = "0.1.0"
edition = "2021"
authors = ["Monstrous Media <package-monster@monstrous.media>"]
description = "Input pattern capture tool for Conductor - record MIDI and gamepad input with privacy controls"
license = "MIT"
repository = "https://github.com/monstrous-media/conductor"

[[bin]]
name = "conductor-capture"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
conductor-core = { version = "0.1.0", path = "../conductor-core" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
colored = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }

# Capture-specific dependencies
tokio = { version = "1.50", features = ["full"] }
uuid = { version = "1.23", features = ["v4", "serde"] }
dirs = { workspace = true }  # Platform-specific app directories
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# #2147: atomic temp-write + rename for capture saves (also used in tests).
tempfile = "3.27"

[lints]
workspace = true
