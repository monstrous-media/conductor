# Minimal example configuration. See config_enhanced.toml for a fuller
# tour of trigger types, modes, and feedback, and config/examples/ for
# device-specific setups.

[[global_mappings]]
description = "Global Action Example"
[global_mappings.trigger]
type = "Note"
note = 0
[global_mappings.action]
type = "Keystroke"
keys = "a"
modifiers = ["cmd"]

[[modes]]
name = "Default"

[[modes.mappings]]
description = "Spotlight Search"
[modes.mappings.trigger]
type = "Note"
note = 12
[modes.mappings.action]
type = "Keystroke"
keys = "space"
modifiers = ["cmd"]

[[modes.mappings]]
description = "Type Q"
[modes.mappings.trigger]
type = "Note"
note = 13
[modes.mappings.action]
type = "Keystroke"
keys = "q"
modifiers = []

[[modes.mappings]]
description = "Screenshot (Cmd+Shift+4)"
[modes.mappings.trigger]
type = "Note"
note = 14
[modes.mappings.action]
type = "Keystroke"
keys = "4"
modifiers = ["cmd", "shift"]
